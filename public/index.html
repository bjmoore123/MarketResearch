<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

<!-- Type -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f1ece0; font-family:'Geist', -apple-system, system-ui, sans-serif; }
  #root, #root > div { width:100%; height:100%; }
  .leaflet-container { outline:none; font-family:inherit; }
  .leaflet-control-attribution { display:none !important; }
  .leaflet-tooltip.atlas-tip {
    background: rgba(247,243,232,0.96) !important;
    border: 1px solid rgba(26,29,35,0.18) !important;
    border-radius: 6px !important;
    box-shadow: 0 6px 20px rgba(26,29,35,0.18) !important;
    padding: 8px 11px !important;
    color: #1a1d23 !important;
  }
  .leaflet-tooltip.atlas-tip::before { display:none !important; }

  /* Atlas-style zoom control */
  .leaflet-control-zoom {
    border: 1px solid rgba(26,29,35,0.18) !important;
    box-shadow: 0 4px 12px rgba(26,29,35,0.10) !important;
    border-radius: 6px !important;
    overflow: hidden;
    margin: 14px !important;
  }
  .leaflet-control-zoom a {
    background: rgba(247,243,232,0.94) !important;
    color: #3d4148 !important;
    border-bottom: 1px solid rgba(26,29,35,0.10) !important;
    width: 28px !important; height: 28px !important; line-height: 28px !important;
    font-family: 'Geist Mono', 'JetBrains Mono', monospace !important;
    font-weight: 400 !important;
    font-size: 16px !important;
    backdrop-filter: blur(4px);
    transition: background .15s;
  }
  .leaflet-control-zoom a:last-child { border-bottom: none !important; }
  .leaflet-control-zoom a:hover {
    background: rgba(247,243,232,1) !important;
    color: #1a1d23 !important;
  }
  .leaflet-control-zoom a.leaflet-disabled {
    color: rgba(26,29,35,0.25) !important;
    background: rgba(247,243,232,0.7) !important;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(26,29,35,0.15); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(26,29,35,0.28); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="atlas-app.jsx"></script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.AtlasApp />);
  </script>
</body>
</html>
